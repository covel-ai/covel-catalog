name: Publish shared catalog policy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-catalog-policy
  cancel-in-progress: false
jobs:
  policy:
    runs-on: ubuntu-latest
    environment: catalog-policy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/catalog/publish-policy.mjs
        env:
          CATALOG_API_URL: ${{ vars.CATALOG_API_URL }}
          CATALOG_POLICY_TOKEN: ${{ secrets.CATALOG_POLICY_TOKEN }}
