<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Covel API 成本模型</title><style>
body{margin:0;font:14px/1.6 var(--font-sans,system-ui);color:var(--foreground,#24352c)}h2{font-size:18px;margin:0 0 8px}p{margin:8px 0;color:var(--muted-foreground,#637169)}label{display:flex;align-items:center;gap:12px;margin:14px 0}input{flex:1;accent-color:var(--chart-1,#47775a)}.plot{height:245px}.row{margin:18px 0}.caption{display:flex;justify-content:space-between;gap:10px;font-size:13px}.track{height:22px;background:var(--muted,#edf0ed);margin-top:6px}.bar{height:22px;background:var(--chart-1,#47775a);transition:width .2s}.axis{display:flex;justify-content:space-between;color:var(--muted-foreground,#637169);font-size:12px}small{display:block;color:var(--muted-foreground,#637169);margin:8px 0}a{color:var(--primary,#32684a)}output{font-variant-numeric:tabular-nums;min-width:50px}b{white-space:nowrap}</style><body>
<h2>1,000 位日活用户：Workers 月费模型</h2><p>30 天，元数据 API。按缓存后的平均 CPU 估算；以下为付费档费用。</p>
<label>平均 CPU <input id="cpu" type="range" min="2" max="10" value="5" step="1"><output id="value">5 ms</output></label>
<div class="plot" id="plot"></div>
<p id="result"></p><small>缓存减少 CPU 与数据库访问，不免除请求计费。D1、R2、ZIP 下载、采集任务及税费另计。前两种场景可能满足免费额度，但需要同时满足 CPU 和存储限制。</small>
<small>这是未来 Cloudflare 适配后的预算模型，当前仓库采用 Node + SQLite + 私有磁盘。核对：2026-10-29 · <a href="https://developers.cloudflare.com/workers/platform/pricing/">官方价格</a></small>
<script>
const scenarios=[['每人 20 次请求 / 天',600000],['每人看完 1,000 条摘要（24 条 / 页）',1260000],['每人 1,000 次独立请求 / 天',30000000]];
function draw(){const cpu=Number(document.getElementById('cpu').value);document.getElementById('value').value=cpu+' ms';document.getElementById('plot').innerHTML=scenarios.map(([label,n])=>{const cost=5+Math.max(0,n-1e7)/1e6*.30+Math.max(0,n*cpu-3e7)/1e6*.02;return '<div class="row"><div class="caption"><span>'+label+'</span><b>$'+cost.toFixed(2)+'</b></div><div class="track"><div class="bar" style="width:'+cost/20*100+'%"></div></div></div>';}).join('')+'<div class="axis"><span>$0</span><span>$5</span><span>$10</span><span>$15</span><span>$20 / 月</span></div>';document.getElementById('result').textContent='每天 100 万次请求：月费 $'+(11+Math.max(0,30*cpu-30)*.02).toFixed(2)+'；页面摘要分页后，1000 人各浏览完整目录只需约 4.2 万次请求 / 天。'}document.getElementById('cpu').addEventListener('input',draw);draw();
</script></body></html>
